<!DOCTYPE html>
<html>
<head>
	<title>homepage of Hyeokjin Jo</title>
    <link rel="stylesheet" type="text/css" href="hompage.css">
    <link href="https://fonts.googleapis.com/css2?family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="intro">
            <img class="profile-picture" src="main.jpg">
            <p class="title-style">My travel records</p>
            <p style="color:rgb(228, 198, 108)">Where I got inspiration and rest</p>
        </div>

        <div class="about-grid">
            <div class="i-am">
                <h3 style="color:rgb(87, 229, 71)">Where I went</h3>
                <ul class="about-list">
                    <li style="color:rgb(252, 110, 27)">Toronto</li>
                    <li style="color:rgb(47, 134, 255)">New York</li>
                    <li style="color:rgb(217, 55, 55)">Tokyo</li>
                </ul>
            </div>
            <div class="i-like">
                <h3 style="color:rgb(87, 229, 71)">What I saw</h3>
                <ul class="about-list">
                    <li style="color:rgb(252, 110, 27)">Niagara Falls</li>
                    <li style="color:rgb(47, 134, 255)">Statue of Liberty</li>
                    <li style="color:rgb(217, 55, 55)">Tokyo Tower</li>
                </ul>
            </div>
        </div>

        <div class="projects-heading">
            <h1><i>My travel spots</i></h1>
            <div class="projects-grid">
				<img class="project-image" src="trip 1.jpg"/>
				<img class="project-image" src="trip 2.jpg"/>
				<img class="project-image" src="trip 3.jpg"/>
				<img class="project-image" src="trip 4.jpg"/>
			</div>
        </div>

        <div class="links-and-cnotact">
            <div class="links">
                <h3>Links</h3>
                <ul class="links-list">
                    <li>
                        <a href="https://github.com/Ayran118">My Github</a>
                    </li>
                    <li>
                        <a href="https://www.sejong.ac.kr/kor/index.do">My School</a>
                    </li>
                </ul>
            </div>

            <div>
                <form action="#">
                    <label for="email">
                        Email: <input type="email" id="email" placeholder="Enter your email" /> 
                    </label>
                    <label for="message">
                        Comment: <textarea id="message">Leave your comment</textarea>
                    </label>
                    <input type="submit" class="submit-button-wrapper" valid="Send Message" />
                </form>
            </div>
        </div>
        <div class="map">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3167.0870744953477!2d126.43939297728785!3d37.4586659720668!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x357b9a833a5efa59%3A0x8d4ba096cb5cbed4!2z7J247LKc6rWt7KCc6rO17ZWt!5e0!3m2!1sko!2skr!4v1774526586248!5m2!1sko!2skr" width="600" height="400" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
    </div>
</body>
</html>
